<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprite Creator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header id="top-bar">
      <div class="app-title">Sprite Creator <span id="project-name" class="project-name"></span></div>
      <div class="top-actions">
        <button class="top-btn" id="btn-new" title="New sprite">New</button>
        <button class="top-btn" id="btn-import" title="Import PNG image">Import</button>
        <button class="top-btn" id="btn-open" title="Open .json">Open</button>
        <button class="top-btn" id="btn-save" title="Save (Ctrl+S)">Save</button>
        <div class="top-btn-group">
          <button class="top-btn" id="btn-export" title="Export (Ctrl+Shift+E)">Export</button>
          <div id="export-dropdown" class="export-dropdown hidden">
            <div class="export-dropdown-title">Export PNG</div>
            <div class="export-scale-row">
              <label>Scale:</label>
              <select id="export-scale" class="export-select">
                <option value="1">1x</option>
                <option value="2">2x</option>
                <option value="4" selected>4x</option>
                <option value="8">8x</option>
                <option value="100">100x</option>
                <option value="500">500x</option>

              </select>
            </div>
            <button class="export-action-btn" id="btn-export-png">Download PNG</button>
            <button class="export-action-btn" id="btn-export-sheet">Layer Sheet</button>
            <button class="export-action-btn" id="btn-export-gif">Download GIF</button>
            <button class="export-action-btn" id="btn-export-anim-sheet">Animation Sheet</button>
            <button class="export-action-btn" id="btn-copy-clipboard">Copy to Clipboard</button>
          </div>
        </div>
      </div>
      <div class="top-right">
        <div class="mini-preview-wrap">
          <span class="mini-label">Preview</span>
          <canvas id="mini-preview"></canvas>
        </div>
      </div>
    </header>

    <!-- Left Sidebar: Tools -->
    <aside id="toolbar"></aside>

    <!-- Main Canvas Area -->
    <main id="canvas-area">
      <canvas id="main-canvas"></canvas>
    </main>

    <!-- Timeline -->
    <div id="timeline"></div>

    <!-- Right Sidebar: Colors + Layers -->
    <aside id="right-panel">
      <div class="panel-tabs">
        <button class="panel-tab active" data-tab="color">Color</button>
        <button class="panel-tab" data-tab="layers">Layers</button>
        <button class="panel-tab" data-tab="templates">Sprites</button>
      </div>
      <div id="color-section">
        <div id="color-picker"></div>
      </div>
      <div id="layer-panel" class="hidden"></div>
      <div id="template-panel" class="hidden"></div>
      <div id="palette-panel"></div>
    </aside>

    <!-- Bottom Bar -->
    <footer id="bottom-bar"></footer>
  </div>

  <dialog id="new-sprite-dialog" class="sprite-dialog">
    <form method="dialog">
      <h3 class="dialog-title">New Sprite</h3>
      <label class="dialog-label">Name
        <input type="text" id="new-sprite-name" class="dialog-input" value="Untitled" autocomplete="off">
      </label>
      <div class="dialog-row">
        <label class="dialog-label">Width
          <input type="number" id="new-sprite-width" class="dialog-input" value="16" min="1" max="128">
        </label>
        <label class="dialog-label">Height
          <input type="number" id="new-sprite-height" class="dialog-input" value="16" min="1" max="128">
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="dialog-btn" id="new-sprite-cancel">Cancel</button>
        <button type="submit" class="dialog-btn dialog-btn-primary" id="new-sprite-ok">Create</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
